# FEP System Configuration
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fep-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - classpath:bpmn.yml
      - classpath:connection.yml

  # Jackson Configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Taipei
    serialization:
      write-dates-as-timestamps: false

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# Application Info
info:
  app:
    name: FEP System
    description: Front-End Processor for FISC Interbank Transactions
    version: 1.0.0-SNAPSHOT

# Camunda BPM Configuration
camunda.bpm:
  admin-user:
    id: admin
    password: ${CAMUNDA_ADMIN_PASSWORD:admin}
    first-name: Admin
    last-name: User
  filter:
    create: All tasks
  authorization:
    enabled: false
  # history-level: full 會記錄所有歷史到 DB，影響效能
  # activity: 只記錄活動層級，平衡效能與追蹤需求
  # none: 完全不記錄（最高效能，但無法查詢歷史）
  history-level: ${CAMUNDA_HISTORY_LEVEL:activity}
  database:
    schema-update: true
  job-execution:
    enabled: true
    # 每次取得的最大作業數（提高並行處理能力）
    max-jobs-per-acquisition: ${CAMUNDA_MAX_JOBS:20}
  metrics:
    enabled: true
    db-reporter-activate: false
  webapp:
    index-redirect-enabled: true
  generic-properties:
    properties:
      # History Time To Live (TTL) - required in Camunda 7.22+
      # 保留歷史資料 180 天
      historyTimeToLive: P180D

# Logging Configuration
logging:
  level:
    root: INFO
    com.fep: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fep-application.log
    max-size: 100MB
    max-history: 30

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

---
# Development Profile (Docker Oracle)
spring:
  config:
    activate:
      on-profile: dev

  # Oracle Database (Docker)
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    driver-class-name: oracle.jdbc.OracleDriver
    username: fep_user
    password: fep_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Settings
  jpa:
    hibernate:
      ddl-auto: none  # 使用 init-scripts 建立 schema
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.OracleDialect

# Camunda Dev Settings
camunda.bpm:
  database:
    type: oracle
  admin-user:
    password: admin

# FEP Settings (Dev Profile)
fep:
  # Pending Transaction Configuration (Pure DB Architecture)
  pending:
    fisc-timeout-ms: 30000

  # Timeout Scanner Configuration (Pure DB Architecture)
  timeout-scanner:
    enabled: true
    interval-ms: 1000
    batch-size: 100

  # HSM Settings (Software HSM for Development)
  hsm:
    type: SOFTWARE
    host: localhost
    port: 1500

  # Transaction Settings
  transaction:
    default-timeout: 30000
    max-retry-count: 3
    retry-interval: 1000

  # Rate Limiting
  rate-limit:
    enabled: true
    max-tps: 1000
    algorithm: TOKEN_BUCKET

  # Security
  security:
    pin-block-format: FORMAT_0
    mac-algorithm: ANSI_X9_19

---
# Development Profile (H2 In-Memory)
spring:
  config:
    activate:
      on-profile: dev-h2

  # H2 Database for quick testing without Docker
  datasource:
    url: jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Settings for H2
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# Camunda H2 Settings
camunda.bpm:
  database:
    type: h2
  admin-user:
    password: admin

fep:
  # Pending Transaction Configuration (Pure DB Architecture)
  pending:
    fisc-timeout-ms: 30000

  # Timeout Scanner Configuration (Pure DB Architecture)
  timeout-scanner:
    enabled: true
    interval-ms: 1000
    batch-size: 100

  # HSM Settings (Software HSM for Development)
  hsm:
    type: SOFTWARE
    host: localhost
    port: 1500

  # Transaction Settings
  transaction:
    default-timeout: 30000
    max-retry-count: 3
    retry-interval: 1000

  # Rate Limiting
  rate-limit:
    enabled: true
    max-tps: 1000
    algorithm: TOKEN_BUCKET

  # Security
  security:
    pin-block-format: FORMAT_0
    mac-algorithm: ANSI_X9_19

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  # Oracle Database (Production)
  datasource:
    url: ${DATABASE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DATABASE_USERNAME:fep_user}
    password: ${DATABASE_PASSWORD:fep_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Settings
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

# Camunda Production Settings
camunda.bpm:
  database:
    type: oracle
    schema-update: false  # Use Flyway or manual migration in production
  admin-user:
    password: ${CAMUNDA_ADMIN_PASSWORD}
  authorization:
    enabled: true
  job-execution:
    max-jobs-per-acquisition: 10

logging:
  level:
    root: INFO
    com.fep: INFO

fep:
  # Pending Transaction Configuration (Pure DB Architecture - Production)
  pending:
    fisc-timeout-ms: ${FISC_TIMEOUT_MS:30000}

  # Timeout Scanner Configuration (Pure DB Architecture - Production)
  timeout-scanner:
    enabled: ${TIMEOUT_SCANNER_ENABLED:true}
    interval-ms: ${TIMEOUT_SCANNER_INTERVAL_MS:1000}
    batch-size: ${TIMEOUT_SCANNER_BATCH_SIZE:100}

  # HSM Settings (Hardware HSM for Production)
  hsm:
    type: THALES
    host: ${HSM_HOST:192.168.1.200}
    port: ${HSM_PORT:1500}

  # Transaction Settings
  transaction:
    default-timeout: 30000
    max-retry-count: 3
    retry-interval: 1000

  # Rate Limiting
  rate-limit:
    enabled: true
    max-tps: 5000
    algorithm: TOKEN_BUCKET
