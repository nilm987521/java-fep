# FEP System Configuration
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: fep-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Jackson Configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Taipei
    serialization:
      write-dates-as-timestamps: false

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# Application Info
info:
  app:
    name: FEP System
    description: Front-End Processor for FISC Interbank Transactions
    version: 1.0.0-SNAPSHOT

# Camunda BPM Configuration
camunda.bpm:
  admin-user:
    id: admin
    password: ${CAMUNDA_ADMIN_PASSWORD:admin}
    first-name: Admin
    last-name: User
  filter:
    create: All tasks
  authorization:
    enabled: false
  # history-level: full 會記錄所有歷史到 DB，影響效能
  # activity: 只記錄活動層級，平衡效能與追蹤需求
  # none: 完全不記錄（最高效能，但無法查詢歷史）
  history-level: ${CAMUNDA_HISTORY_LEVEL:activity}
  database:
    schema-update: true
  job-execution:
    enabled: true
    # 每次取得的最大作業數（提高並行處理能力）
    max-jobs-per-acquisition: ${CAMUNDA_MAX_JOBS:20}
  metrics:
    enabled: true
    db-reporter-activate: false
  webapp:
    index-redirect-enabled: true
  generic-properties:
    properties:
      # History Time To Live (TTL) - required in Camunda 7.22+
      # 保留歷史資料 180 天
      historyTimeToLive: P180D
      # 或者關閉 TTL 強制檢查 (不建議用於生產環境)
      # enforceHistoryTimeToLive: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.fep: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fep-application.log
    max-size: 100MB
    max-history: 30

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  # H2 Database for Camunda (Development)
  datasource:
    url: jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# Camunda Dev Settings
camunda.bpm:
  database:
    type: h2
  admin-user:
    password: admin

fep:
  # Pending Transaction Configuration (Pure DB Architecture)
  pending:
    fisc-timeout-ms: 30000          # FISC 回應超時時間

  # Timeout Scanner Configuration (Pure DB Architecture)
  # 使用 DB FOR UPDATE SKIP LOCKED，不需要 Redis 分散式鎖
  timeout-scanner:
    enabled: true                    # 啟用超時掃描器
    interval-ms: 1000               # 掃描間隔 (1 秒)
    batch-size: 100                 # 每次掃描的最大數量

  # Dynamic Connection Management
  connection:
    dynamic-management:
      enabled: true                    # 啟用動態連線管理
    config-path: ${CONNECTION_CONFIG_FILE:config/channel-config.json}
    hot-reload-enabled: ${CONNECTION_HOT_RELOAD:false}
    auto-connect: true                 # 開發環境不自動連線
    auto-sign-on: false
    graceful-shutdown-timeout-ms: 5000

  # Channel-Schema Mapping Configuration
  channel:
    enabled: true
    config-file: ${CHANNEL_CONFIG_FILE:config/channel-schema-mapping.json}
    hot-reload: ${CHANNEL_HOT_RELOAD:false}
    hot-reload-interval: 5000
    fail-on-missing-config: false
    validate-schema-references: false

  # FISC Connection Settings (Development)
  fisc:
    # Single-channel mode (legacy)
    host: localhost
    port: 9000
    connection-timeout: 10000
    read-timeout: 30000
    heartbeat-interval: 30000
    max-connections: 5
    auto-reconnect: true

    # Dual-channel mode (FISC standard)
    dual-channel:
      enabled: false  # Set to true to enable dual-channel mode
      send-host: localhost
      send-port: 9001
      receive-host: localhost
      receive-port: 9002
      failure-strategy: FAIL_WHEN_BOTH_DOWN  # FAIL_WHEN_BOTH_DOWN, FAIL_WHEN_ANY_DOWN

  # HSM Settings (Software HSM for Development)
  hsm:
    type: SOFTWARE
    host: localhost
    port: 1500

  # Transaction Settings
  transaction:
    default-timeout: 30000
    max-retry-count: 3
    retry-interval: 1000

  # Rate Limiting
  rate-limit:
    enabled: true
    max-tps: 1000
    algorithm: TOKEN_BUCKET

  # Security
  security:
    pin-block-format: FORMAT_0
    mac-algorithm: ANSI_X9_19

  # BPMN Integration Settings (Development)
  # 完全配置化設計：所有 MTI 統一走 BPMN 流程，具體走哪個流程由 process-routing 決定
  communication:
    fisc:
      default-channel: FISC_INTERBANK_V1
      timeout-ms: 30000

  # BPMN 設定（完全配置化）
  # 新增 MTI 時，只需在此加入規則 + 部署對應 BPMN 流程，不需修改 Java 代碼
  bpmn:
    high-tps-mode: true             # 啟用高 TPS 模式 (兩個 BPMN 流程)
    process-routing:
      enabled: true
      default-process: Process_TransferRequest  # 高 TPS 模式使用 Request 流程

      rules:
        # ===== 金融交易 =====
        # 跨行轉帳 (Processing Code: 40xxxx) - 使用高 TPS 架構
        - name: 跨行轉帳
          mti: "0200"
          processing-code: "010000"
          # 高 TPS 模式：使用 Request BPMN 流程
          process-key: Process_TransferRequest
          priority: 100

        # 跨行提款 (Processing Code: 01xxxx)
        - name: 跨行提款
          mti: "0200"
          processing-code: "01"
          process-key: Process_TransferRequest
          priority: 100

        # 餘額查詢 (Processing Code: 31xxxx)
        - name: 餘額查詢
          mti: "0200"
          processing-code: "31"
          process-key: Process_TransferRequest
          priority: 100

        # ===== 沖正交易 =====
        - name: 沖正交易
          mti: "0400"
          process-key: Process_TransferRequest
          priority: 100

        # ===== 網路管理 =====
        - name: 網路管理
          mti: "0800"
          process-key: Only_Log_Process
          priority: 100

        # ===== 特殊通道 =====
        # ATM 2500 交易 - 使用簡單日誌流程
        - name: ATM 2500 交易
          channel-pattern: "ATM.*"
          mti: "2500"
          process-key: Only_Log_Process
          priority: 10

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  # Oracle Database for Camunda (Production)
  datasource:
    url: ${DATABASE_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DATABASE_USERNAME:fep}
    password: ${DATABASE_PASSWORD:fep}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# Camunda Production Settings
camunda.bpm:
  database:
    type: oracle
    schema-update: false  # Use Flyway or manual migration in production
  admin-user:
    password: ${CAMUNDA_ADMIN_PASSWORD}
  authorization:
    enabled: true
  job-execution:
    max-jobs-per-acquisition: 10

logging:
  level:
    root: ERROR
    com.fep: ERROR

fep:
  # Pending Transaction Configuration (Pure DB Architecture - Production)
  pending:
    fisc-timeout-ms: ${FISC_TIMEOUT_MS:30000}

  # Timeout Scanner Configuration (Pure DB Architecture - Production)
  # 使用 DB FOR UPDATE SKIP LOCKED，不需要 Redis 分散式鎖
  timeout-scanner:
    enabled: ${TIMEOUT_SCANNER_ENABLED:true}
    interval-ms: ${TIMEOUT_SCANNER_INTERVAL_MS:1000}
    batch-size: ${TIMEOUT_SCANNER_BATCH_SIZE:100}

  # Dynamic Connection Management (Production)
  connection:
    dynamic-management:
      enabled: true
    config-path: ${CONNECTION_CONFIG_FILE:config/channel-config.json}
    hot-reload-enabled: ${CONNECTION_HOT_RELOAD:true}
    auto-connect: true
    auto-sign-on: true
    graceful-shutdown-timeout-ms: 10000

  # Channel-Schema Mapping Configuration (Production)
  channel:
    enabled: true
    config-file: ${CHANNEL_CONFIG_FILE:config/channel-schema-mapping.json}
    hot-reload: ${CHANNEL_HOT_RELOAD:true}
    hot-reload-interval: 10000
    fail-on-missing-config: true
    validate-schema-references: true

  # FISC Connection Settings (Production)
  fisc:
    # Single-channel mode (legacy/fallback)
    host: ${FISC_HOST:192.168.1.100}
    port: ${FISC_PORT:9000}
    connection-timeout: 10000
    read-timeout: 30000
    heartbeat-interval: 30000
    max-connections: 20
    auto-reconnect: true

    # Dual-channel mode (FISC standard - RECOMMENDED for production)
    dual-channel:
      enabled: ${FISC_DUAL_CHANNEL_ENABLED:true}
      send-host: ${FISC_SEND_HOST:192.168.1.100}
      send-port: ${FISC_SEND_PORT:9001}
      send-backup-host: ${FISC_SEND_BACKUP_HOST:192.168.1.101}
      send-backup-port: ${FISC_SEND_BACKUP_PORT:9001}
      receive-host: ${FISC_RECV_HOST:192.168.1.100}
      receive-port: ${FISC_RECV_PORT:9002}
      receive-backup-host: ${FISC_RECV_BACKUP_HOST:192.168.1.101}
      receive-backup-port: ${FISC_RECV_BACKUP_PORT:9002}
      failure-strategy: FAIL_WHEN_BOTH_DOWN
      health-check-interval: 10000

  # HSM Settings (Hardware HSM for Production)
  hsm:
    type: THALES
    host: ${HSM_HOST:192.168.1.200}
    port: ${HSM_PORT:1500}

  # Transaction Settings
  transaction:
    default-timeout: 30000
    max-retry-count: 3
    retry-interval: 1000

  # Rate Limiting
  rate-limit:
    enabled: true
    max-tps: 5000
    algorithm: TOKEN_BUCKET

  # BPMN Integration Settings (Production)
  # 完全配置化設計：所有 MTI 統一走 BPMN 流程
  communication:
    fisc:
      default-channel: ${FISC_DEFAULT_CHANNEL:FISC_INTERBANK_V1}
      timeout-ms: ${FISC_TIMEOUT_MS:30000}

  # BPMN 設定 (Production)
  # 新增 MTI 時，只需在此加入規則 + 部署對應 BPMN 流程，不需修改 Java 代碼
  bpmn:
    high-tps-mode: ${BPMN_HIGH_TPS_MODE:true}
    process-routing:
      enabled: ${BPMN_ROUTING_ENABLED:true}
      default-process: ${BPMN_DEFAULT_PROCESS:Process_TransferRequest}

      rules:
        # ===== 金融交易 =====
        # 跨行轉帳 (Processing Code: 40xxxx) - 高 TPS 架構
        - name: 跨行轉帳
          mti: "0200"
          processing-code: "40"
          process-key: Process_TransferRequest
          priority: 100

        # 跨行提款 (Processing Code: 01xxxx)
        - name: 跨行提款
          mti: "0200"
          processing-code: "01"
          process-key: Process_TransferRequest
          priority: 100

        # 餘額查詢 (Processing Code: 31xxxx)
        - name: 餘額查詢
          mti: "0200"
          processing-code: "31"
          process-key: Process_TransferRequest
          priority: 100

        # ===== 沖正交易 =====
        - name: 沖正交易
          mti: "0400"
          process-key: Process_TransferRequest
          priority: 100

        # ===== 網路管理 =====
        - name: 網路管理
          mti: "0800"
          process-key: Process_NetworkManagement
          priority: 100

        # ===== 特殊通道 =====
        # ATM 2500 交易 - 使用簡單日誌流程
        - name: ATM 2500 交易
          channel-pattern: "ATM.*"
          mti: "2500"
          process-key: Only_Log_Process
          priority: 10
