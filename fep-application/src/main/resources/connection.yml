# FEP Connection Configuration
# 連線、通道、FISC 相關設定

---
# Development Profile (Oracle)
spring:
  config:
    activate:
      onProfile: dev

fep:
  # Dynamic Connection Management
  connection:
    dynamicManagement:
      enabled: true
    configPath: ${CONNECTION_CONFIG_FILE:config/channel-config.yml}
    hotReloadEnabled: ${CONNECTION_HOT_RELOAD:false}
    autoConnect: true
    autoSignOn: false
    gracefulShutdownTimeoutMs: 5000

  # Channel-Schema Mapping Configuration
  channel:
    enabled: true
    configFile: ${CHANNEL_CONFIG_FILE:config/channel-schema-mapping.yml}
    hotReload: ${CHANNEL_HOT_RELOAD:false}
    hotReloadInterval: 5000
    failOnMissingConfig: false
    validateSchemaReferences: false

  # FISC Connection Settings (Development)
  fisc:
    host: localhost
    port: 9000
    connectionTimeout: 10000
    readTimeout: 30000
    heartbeatInterval: 30000
    maxConnections: 5
    autoReconnect: true
    dualChannel:
      enabled: true

  # BPMN Integration Settings
  communication:
    fisc:
      defaultChannel: FISC_INTERBANK_V1
      timeoutMs: 30000

---
# Development Profile (H2 In-Memory)
spring:
  config:
    activate:
      onProfile: dev-h2

fep:
  # Dynamic Connection Management
  connection:
    dynamicManagement:
      enabled: true
    configPath: ${CONNECTION_CONFIG_FILE:config/channel-config.yml}
    hotReloadEnabled: ${CONNECTION_HOT_RELOAD:false}
    autoConnect: true
    autoSignOn: false
    gracefulShutdownTimeoutMs: 5000

  # Channel-Schema Mapping Configuration
  channel:
    enabled: true
    configFile: ${CHANNEL_CONFIG_FILE:config/channel-schema-mapping.yml}
    hotReload: ${CHANNEL_HOT_RELOAD:false}
    hotReloadInterval: 5000
    failOnMissingConfig: false
    validateSchemaReferences: false

  # FISC Connection Settings (Development)
  fisc:
    # Single-channel mode (legacy)
    host: localhost
    port: 9000
    connectionTimeout: 10000
    readTimeout: 30000
    heartbeatInterval: 30000
    maxConnections: 5
    autoReconnect: true

    # Dual-channel mode (FISC standard)
    dualChannel:
      enabled: false
      sendHost: 127.0.0.1
      sendPort: 9001
      receiveHost: 127.0.0.1
      receivePort: 9002
      failureStrategy: FAIL_WHEN_BOTH_DOWN

  # BPMN Integration Settings (Development)
  communication:
    fisc:
      defaultChannel: FISC_INTERBANK_V1
      timeoutMs: 30000

---
# Production Profile
spring:
  config:
    activate:
      onProfile: prod

fep:
  # Dynamic Connection Management (Production)
  connection:
    dynamicManagement:
      enabled: true
    configPath: ${CONNECTION_CONFIG_FILE:config/channel-config.yml}
    hotReloadEnabled: ${CONNECTION_HOT_RELOAD:true}
    autoConnect: true
    autoSignOn: true
    gracefulShutdownTimeoutMs: 10000

  # Channel-Schema Mapping Configuration (Production)
  channel:
    enabled: true
    configFile: ${CHANNEL_CONFIG_FILE:config/channel-schema-mapping.yml}
    hotReload: ${CHANNEL_HOT_RELOAD:true}
    hotReloadInterval: 10000
    failOnMissingConfig: true
    validateSchemaReferences: true

  # FISC Connection Settings (Production)
  fisc:
    # Single-channel mode (legacy/fallback)
    host: ${FISC_HOST:192.168.1.100}
    port: ${FISC_PORT:9000}
    connectionTimeout: 10000
    readTimeout: 30000
    heartbeatInterval: 30000
    maxConnections: 20
    autoReconnect: true

    # Dual-channel mode (FISC standard - RECOMMENDED for production)
    dualChannel:
      enabled: ${FISC_DUAL_CHANNEL_ENABLED:true}
      sendHost: ${FISC_SEND_HOST:192.168.1.100}
      sendPort: ${FISC_SEND_PORT:9001}
      sendBackupHost: ${FISC_SEND_BACKUP_HOST:192.168.1.101}
      sendBackupPort: ${FISC_SEND_BACKUP_PORT:9001}
      receiveHost: ${FISC_RECV_HOST:192.168.1.100}
      receivePort: ${FISC_RECV_PORT:9002}
      receiveBackupHost: ${FISC_RECV_BACKUP_HOST:192.168.1.101}
      receiveBackupPort: ${FISC_RECV_BACKUP_PORT:9002}
      failureStrategy: FAIL_WHEN_BOTH_DOWN
      healthCheckInterval: 10000

  # BPMN Integration Settings (Production)
  communication:
    fisc:
      defaultChannel: ${FISC_DEFAULT_CHANNEL:FISC_INTERBANK_V1}
      timeoutMs: ${FISC_TIMEOUT_MS:30000}
