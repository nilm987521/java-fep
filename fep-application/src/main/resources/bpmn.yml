# BPMN Routing Configuration
# 此檔案定義 BPMN 流程路由規則
# 新增 MTI 時，只需在此加入規則 + 部署對應 BPMN 流程，不需修改 Java 代碼

# ===== 預設設定 (所有 Profile 共用) =====
fep:
  bpmn:
    highTpsMode: true
    processRouting:
      enabled: true
      defaultProcess: Process_TransferRequest

---
# Development Profile (Oracle)
spring:
  config:
    activate:
      on-profile: dev

fep:
  bpmn:
    processRouting:
      rules:
        - name: 跨行轉帳-請求
          mti: "0200"
          processKey: ATM_Request_Process
          processingCode: "010000"
          channelPattern: "ATM.*"
          priority: 100
        - name: 跨行轉帳-回應
          mti: "0210"
          processKey: ATM_Response_Process
          processingCode: "010000"
          channelPattern: "FISC.*"
          priority: 100

---
# Development Profile (H2 In-Memory)
spring:
  config:
    activate:
      on-profile: dev-h2

fep:
  bpmn:
    processRouting:
      rules:
        # ===== 金融交易 =====
        - name: 跨行轉帳
          mti: "0200"
          processingCode: "010000"
          channelPattern: "ATM.*"
          processKey: ATM_Request_Process
          priority: 100

        - name: 餘額查詢
          mti: "0200"
          processingCode: "31"
          channelPattern: "ATM.*"
          processKey: Process_TransferRequest
          priority: 100

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

fep:
  bpmn:
    highTpsMode: ${BPMN_HIGH_TPS_MODE:true}
    processRouting:
      enabled: ${BPMN_ROUTING_ENABLED:true}
      defaultProcess: ${BPMN_DEFAULT_PROCESS:Process_TransferRequest}

      rules:
        # ===== 金融交易 =====
        - name: 跨行轉帳
          mti: "0200"
          processingCode: "40"
          processKey: Process_TransferRequest
          priority: 100

        - name: 跨行提款
          mti: "0200"
          processingCode: "01"
          processKey: Process_TransferRequest
          priority: 100

        - name: 餘額查詢
          mti: "0200"
          processingCode: "31"
          processKey: Process_TransferRequest
          priority: 100

        # ===== 沖正交易 =====
        - name: 沖正交易
          mti: "0400"
          processKey: Process_TransferRequest
          priority: 100

        # ===== 網路管理 =====
        - name: 網路管理
          mti: "0800"
          processKey: Process_NetworkManagement
          priority: 100

        # ===== 特殊通道 =====
        - name: ATM 2500 交易
          channelPattern: "ATM.*"
          mti: "2500"
          processKey: Only_Log_Process
          priority: 10
