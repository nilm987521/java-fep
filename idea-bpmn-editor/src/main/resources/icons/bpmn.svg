<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <linearGradient id="bpmnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Start Event (Circle) -->
  <circle cx="3" cy="8" r="2.5" fill="none" stroke="url(#bpmnGrad)" stroke-width="1.5"/>
  <!-- Task (Rounded Rectangle) -->
  <rect x="7" y="5" width="5" height="6" rx="1" fill="none" stroke="url(#bpmnGrad)" stroke-width="1.5"/>
  <!-- End Event (Circle with thick border) -->
  <circle cx="15" cy="8" r="2" fill="none" stroke="url(#bpmnGrad)" stroke-width="2"/>
  <!-- Arrows -->
  <line x1="5.5" y1="8" x2="6.5" y2="8" stroke="url(#bpmnGrad)" stroke-width="1"/>
  <line x1="12.5" y1="8" x2="12.5" y2="8" stroke="url(#bpmnGrad)" stroke-width="1"/>
</svg>
