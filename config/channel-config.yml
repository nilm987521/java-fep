# FEP Channel Connection Configuration
# 統一通道連線配置，結合邏輯通道與實體連線

schema: fep-channel-connection-config-v2
version: "2.0"
last-modified: "2026-01-24T10:00:00Z"
description: Unified channel connection configuration combining logical channels with physical connections

# 連線 Profile 定義
connection-profiles:
  FISC_PRIMARY:
    host: localhost
    send-port: 9001
    receive-port: 9002
    connect-timeout: 5000
    response-timeout: 30000
    heartbeat-interval: 60000
    max-retries: 60
    retry-delay: 5000
    ssl-enabled: false
    pool-size: 1
    auto-reconnect: true
    keep-alive-interval: 30000
    properties:
      institution-id: "012"
      mac-algorithm: ANSI_X9_19

  LOCAL_TEST:
    host: localhost
    send-port: 19001
    receive-port: 19002
    connect-timeout: 3000
    response-timeout: 10000
    heartbeat-interval: 30000
    max-retries: 1
    retry-delay: 1000
    ssl-enabled: false
    auto-reconnect: true
    properties:
      institution-id: "999"

  ATM_SERVER:
    host: 0.0.0.0
    send-port: 19001
    receive-port: 19001
    dual-channel: false
    connect-timeout: 3000
    response-timeout: 10000
    heartbeat-interval: 30000
    max-retries: 1
    retry-delay: 1000
    ssl-enabled: false
    auto-reconnect: false
    connection-mode: SERVER
    properties:
      institution-id: "822"

# 邏輯通道定義
channels:
  FISC_INTERBANK_V1:
    connection-profile: FISC_PRIMARY
    description: Taiwan FISC standard interbank protocol for FEP-to-FISC communication
    active: true
    priority: 1
    schemas:
      "0100": FISC ATM Format
      "0110": FISC ATM Format
      "0200": FISC ATM Format
      "0210": FISC ATM Format
      "0400": FISC ATM Format
      "0410": FISC ATM Format
      "0800": FISC ATM Format
      "0810": FISC ATM Format
    properties:
      encoding: ASCII
      mac-required: "true"
      institution-id: "822"
      mac-algorithm: ANSI_X9_19
      transaction-timeout: "30000"

  ATM_FISC_V1:
    connection-profile: ATM_SERVER
    description: ATM connection endpoint - FEP listens for ATM connections
    active: true
    priority: 1
    schemas:
      "0200": FISC ATM Format
      "0210": FISC ATM Format
      "0400": FISC ATM Format
      "0410": FISC ATM Format
    properties:
      encoding: ASCII
      mac-required: "true"
      institution-id: "822"

  LOCAL_TEST_V1:
    connection-profile: LOCAL_TEST
    description: Local test channel for development and testing
    active: false
    priority: 100
    schemas:
      "0200": FISC ATM Format
      "0210": FISC ATM Format
      "0400": FISC ATM Format
      "0410": FISC ATM Format
      "0800": FISC ATM Format
      "0810": FISC ATM Format
    properties:
      encoding: ASCII
      mac-required: "false"
      institution-id: "999"
      test-mode: "true"

# 預設值
defaults:
  fallback-profile: LOCAL_TEST
  fallback-channel: LOCAL_TEST_V1
  unknown-channel-behavior: USE_FALLBACK
  missing-profile-behavior: THROW_ERROR
