services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: fep-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: fep_password
      APP_USER: fep_user
      APP_USER_PASSWORD: fep_password
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./init-scripts:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  oracle-data:
    driver: local
  redis-data:
    driver: local
